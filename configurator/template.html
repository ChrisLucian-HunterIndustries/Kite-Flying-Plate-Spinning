<!-- TEMPLATE - DO NOT PASTE. Paste pastable-kite-configurator.html (built by `npm run build`) instead; this file has empty placeholders. -->
<div id="kite-cfg">
<style>
#kite-cfg{--kc-sky:#e8f4ff;--kc-ink:#1d2b3a;--kc-kite:#e4572e;--kc-line:#9bb7d4;font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--kc-ink);background:linear-gradient(180deg,var(--kc-sky),#fff);border:1px solid var(--kc-line);border-radius:12px;padding:16px;max-width:900px;box-sizing:border-box}
#kite-cfg *{box-sizing:border-box}
#kite-cfg h3{margin:0 0 4px;font-size:1.4em}
#kite-cfg h4{margin:18px 0 6px}
#kite-cfg p{margin:0 0 10px}
#kite-cfg fieldset{border:1px solid var(--kc-line);border-radius:8px;margin:10px 0;padding:8px 12px;background:#fff}
#kite-cfg legend{font-weight:600;padding:0 6px}
#kite-cfg .kc-wind{padding:6px 0;border-bottom:1px dashed #dde7f0}
#kite-cfg .kc-wind:last-child{border-bottom:0}
#kite-cfg label{cursor:pointer}
#kite-cfg .kc-summary{display:block;margin-left:24px;font-size:.88em;opacity:.8}
#kite-cfg .kc-skill{display:inline-block;margin:4px 0 0 24px;font-size:.88em;background:#fff4e5;border:1px solid #f3c58b;border-radius:999px;padding:1px 10px}
#kite-cfg .kc-skill input:disabled+span{opacity:.45}
#kite-cfg .kc-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
#kite-cfg button{font:inherit;font-size:.9em;padding:4px 12px;border-radius:6px;border:1px solid var(--kc-line);background:#fff;color:var(--kc-ink);cursor:pointer}
#kite-cfg button.kc-primary{background:var(--kc-kite);border-color:var(--kc-kite);color:#fff}
#kite-cfg .kc-meter{margin-left:auto;font-weight:600}
#kite-cfg textarea{width:100%;font:12.5px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--kc-line);border-radius:6px;padding:8px;background:#fbfdff;color:var(--kc-ink)}
#kite-cfg details{border:1px solid #f3c58b;border-radius:8px;margin:6px 0;padding:6px 10px;background:#fffaf2}
#kite-cfg summary{cursor:pointer;font-family:ui-monospace,Consolas,monospace}
#kite-cfg .kc-empty{opacity:.7;font-style:italic}
</style>
<h3>&#x1FA81; Kite Configurator</h3>
<p>Check the <strong>wind</strong> that holds your AGENTS.md kite aloft. Add a skill to give a wind element extra lift.</p>
<div class="kc-bar">
<button type="button" data-kc="defaults">Defaults</button>
<button type="button" data-kc="all-wind">All wind</button>
<button type="button" data-kc="no-wind">Calm (none)</button>
<button type="button" data-kc="all-skills">All skills</button>
<button type="button" data-kc="no-skills">No skills</button>
<span class="kc-meter" data-kc-meter></span>
</div>
<fieldset><legend>Principles</legend><div data-kc-kind="principle"></div></fieldset>
<fieldset><legend>Checklist wind</legend><div data-kc-kind="checklist"></div></fieldset>
<h4>AGENTS.md</h4>
<div class="kc-bar">
<button type="button" class="kc-primary" data-kc-copy="agents">Copy</button>
<button type="button" data-kc-download="agents">Download</button>
</div>
<textarea data-kc-output rows="18" readonly spellcheck="false" aria-label="Generated AGENTS.md"></textarea>
<h4>Skills <small>(save each to the path shown)</small></h4>
<div data-kc-skills></div>
<script>
//<![CDATA[
/*__KITE_COMPOSE__*/
(function () {
  'use strict';
  var DATA = /*__KITE_DATA__*/;
  var C = window.KiteCompose;
  var root = document.getElementById('kite-cfg');
  var $ = function (sel) { return root.querySelector(sel); };
  var state = { winds: new Set(), skills: new Set() };

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      if (k === 'text') node.textContent = attrs[k];
      else node.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { node.appendChild(c); });
    return node;
  }

  function checkbox(kind, value) {
    return el('input', { type: 'checkbox', 'data-kc-check': kind, value: value });
  }

  function windRow(w) {
    var row = el('div', { 'class': 'kc-wind' }, [
      el('label', {}, [checkbox('wind', w.id), document.createTextNode(' '), el('strong', { text: w.title })]),
      el('span', { 'class': 'kc-summary', text: w.summary }),
    ]);
    w.skills.forEach(function (name) {
      var skill = DATA.skills[name];
      row.appendChild(el('label', { 'class': 'kc-skill', title: skill.description }, [
        checkbox('skill', name), el('span', { text: ' \uD83E\uDDF0 skill: ' + name }),
      ]));
    });
    return row;
  }

  function copyText(text, button) {
    var done = function () {
      var label = button.textContent;
      button.textContent = 'Copied!';
      setTimeout(function () { button.textContent = label; }, 1500);
    };
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text); done(); });
    } else { legacyCopy(text); done(); }
  }

  function legacyCopy(text) {
    var area = el('textarea', { readonly: '', style: 'position:fixed;opacity:0' });
    area.value = text;
    root.appendChild(area);
    area.select();
    document.execCommand('copy');
    root.removeChild(area);
  }

  function download(fileName, text) {
    var url = URL.createObjectURL(new Blob([text], { type: 'text/markdown;charset=utf-8' }));
    var link = el('a', { href: url, download: fileName });
    root.appendChild(link);
    link.click();
    root.removeChild(link);
    setTimeout(function () { URL.revokeObjectURL(url); }, 0);
  }

  function skillCard(skill) {
    var text = DATA.skills[skill.name].content;
    var copy = el('button', { type: 'button', text: 'Copy' });
    var save = el('button', { type: 'button', text: 'Download' });
    copy.addEventListener('click', function () { copyText(text, copy); });
    save.addEventListener('click', function () { download(skill.name + '-SKILL.md', text); });
    var area = el('textarea', { rows: '10', readonly: '', spellcheck: 'false' });
    area.value = text;
    return el('details', {}, [
      el('summary', { text: C.skillPath(skill.name) + '  (' + skill.winds.join(', ') + ')' }),
      el('div', { 'class': 'kc-bar' }, [copy, save]), area,
    ]);
  }

  function render() {
    var windIds = Array.from(state.winds);
    var skillNames = Array.from(state.skills);
    root.querySelectorAll('[data-kc-check]').forEach(function (box) {
      var isWind = box.getAttribute('data-kc-check') === 'wind';
      box.checked = (isWind ? state.winds : state.skills).has(box.value);
      if (!isWind) box.disabled = !state.winds.has(box.closest('.kc-wind').querySelector('[data-kc-check="wind"]').value);
    });
    $('[data-kc-output]').value = C.composeAgentsMd(DATA.winds, windIds, skillNames);
    $('[data-kc-meter]').textContent = 'Wind: ' + state.winds.size + '/' + DATA.winds.length + ' \uD83E\uDE81';
    var skills = C.includedSkills(DATA.winds, windIds, skillNames);
    var list = $('[data-kc-skills]');
    list.textContent = '';
    if (!skills.length) list.appendChild(el('p', { 'class': 'kc-empty', text: 'No skills selected.' }));
    skills.forEach(function (s) { list.appendChild(skillCard(s)); });
  }

  var presets = {
    'defaults': function () {
      state.winds = new Set(DATA.winds.filter(function (w) { return w.default; }).map(function (w) { return w.id; }));
      state.skills = new Set();
    },
    'all-wind': function () { state.winds = new Set(DATA.winds.map(function (w) { return w.id; })); },
    'no-wind': function () { state.winds = new Set(); },
    'all-skills': function () { state.skills = new Set(Object.keys(DATA.skills)); },
    'no-skills': function () { state.skills = new Set(); },
  };

  DATA.winds.forEach(function (w) { root.querySelector('[data-kc-kind="' + w.kind + '"]').appendChild(windRow(w)); });

  root.addEventListener('change', function (e) {
    var kind = e.target.getAttribute('data-kc-check');
    if (!kind) return;
    var set = kind === 'wind' ? state.winds : state.skills;
    if (e.target.checked) set.add(e.target.value); else set.delete(e.target.value);
    render();
  });
  root.addEventListener('click', function (e) {
    var preset = e.target.getAttribute('data-kc');
    if (presets[preset]) { presets[preset](); render(); }
    if (e.target.hasAttribute('data-kc-copy')) copyText($('[data-kc-output]').value, e.target);
    if (e.target.hasAttribute('data-kc-download')) download('AGENTS.md', $('[data-kc-output]').value);
  });

  presets.defaults();
  render();
})();
//]]>
</script>
</div>
